name: Release Tauri desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach artifacts to (e.g. 0.6.0-preview.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test C# backend
        run: dotnet test tests/CrossBusExplorer.Tests/CrossBusExplorer.Tests.csproj --configuration Release --nologo

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: "app,dmg"
          - os: windows-2022
            bundles: "nsis,msi"
          - os: ubuntu-22.04
            bundles: "appimage,deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Ui/Desktop/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: src/Ui/Desktop
        run: npm ci
      - name: Build native package
        working-directory: src/Ui/Desktop
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Verify macOS arm64 signature and package .app.zip
        if: runner.os == 'macOS'
        working-directory: src/Ui/Desktop/src-tauri/target/release/bundle/macos
        run: |
          codesign --verify --deep --strict -vvv "Cross Bus Explorer.app"
          ditto -c -k --sequesterRsrc --keepParent "Cross Bus Explorer.app" "Cross-Bus-Explorer_macos_arm64.app.zip"
      - name: Upload installers to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          find src/Ui/Desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name "*.dmg" -o -name "*.app.zip" -o -name "*-setup.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp -v {} release-assets/ \;
          ls -lh release-assets
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
