name: Build and test Tauri desktop

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag to build and attach artifacts to (e.g. 0.6.0-preview.1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test C# backend
        run: dotnet test tests/CrossBusExplorer.Tests/CrossBusExplorer.Tests.csproj --configuration Release --nologo

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: "app,dmg"
            artifact: macos-arm64
            paths: |
              src/Ui/Desktop/src-tauri/target/release/bundle/dmg/*.dmg
              src/Ui/Desktop/src-tauri/target/release/bundle/macos/*.app.zip
          - os: windows-2022
            bundles: "nsis,msi"
            artifact: windows-x64
            paths: |
              src/Ui/Desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
              src/Ui/Desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            bundles: "appimage,deb"
            artifact: linux-x64
            paths: |
              src/Ui/Desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              src/Ui/Desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Ui/Desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: src/Ui/Desktop
        run: npm ci
      - name: Build native package
        working-directory: src/Ui/Desktop
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Verify macOS arm64 signature and package .app.zip
        if: runner.os == 'macOS'
        working-directory: src/Ui/Desktop/src-tauri/target/release/bundle/macos
        run: |
          codesign --verify --deep --strict -vvv "Cross Bus Explorer.app"
          ditto -c -k --sequesterRsrc --keepParent "Cross Bus Explorer.app" "Cross-Bus-Explorer_macos_arm64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-bus-explorer-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build-desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.zip" -o -name "*-setup.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp -v {} release-assets/ \;
          ls -lh release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
          files: release-assets/*
          append_body: true
          body: |

            ### Installation Notes
            - **macOS (Apple Silicon `arm64`)**: Download the `.dmg` or `.app.zip`. Because builds are ad-hoc signed without paid Apple notarization, if macOS Gatekeeper blocks first launch after downloading from a browser, clear the quarantine attribute in Terminal:
              ```bash
              xattr -cr "/Applications/Cross Bus Explorer.app"
              ```
            - **Windows (`x64`)**: Run the `*-setup.exe` (NSIS) or `*.msi` installer.
            - **Linux (`x64`)**: Install the `*.deb` package (`sudo apt install ./Cross*.deb`) or make `*.AppImage` executable (`chmod +x *.AppImage`).
